  # ----------------------------------------------------------------------------------------------
  # Phase 3 — billetterie : tarifs, commandes, paiements, billets, contrôle
  # ----------------------------------------------------------------------------------------------
  /organizations/{organizationId}/events/{eventId}/ticket-types:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Tarifs avec compteurs (vendus, réservés, restants)
      description: "`events.read`."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/TicketType" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer un tarif
      description: "`tickets.manage`. Audit `ticket_type.created`."
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TicketTypeWrite" } } } }
      responses:
        "201":
          {
            description: Créé,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/TicketType" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/events/{eventId}/ticket-types/{ticketTypeId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: ticketTypeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifier un tarif
      description: "`tickets.manage`. Le prix d'un billet déjà vendu ne change pas (instantané dans order_items)."
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      summary: Archiver un tarif
      description: "`tickets.manage`. 412 tant que des réservations en cours l'utilisent."
      responses:
        "204": { description: Archivé }
        "412": { description: Réservations en cours }
  /organizations/{organizationId}/events/{eventId}/ticketing:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Paramètres de vente
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema: { type: object, properties: { data: { $ref: "#/components/schemas/TicketingSettings" } } },
                  },
              },
          }
    patch:
      summary: Ouvrir / fermer les ventes, maximum par commande, clôture, billets nominatifs
      description: "`tickets.manage`. Ouverture refusée (412) sans tarif actif ou si l'événement n'est pas publié."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketingStatus: { type: string, enum: [open, closed] }
                maxTicketsPerOrder: { type: integer, minimum: 1, maximum: 50 }
                salesCloseAt: { type: [string, "null"], format: date-time }
                nominativeTickets: { type: boolean }
      responses:
        "200": { description: OK }
        "412": { description: Préconditions d'ouverture non remplies }
  /organizations/{organizationId}/events/{eventId}/pools:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get: { summary: Pools de capacité partagée, responses: { "200": { description: OK } } }
    post:
      summary: Créer un pool
