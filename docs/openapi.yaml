        revue : active immédiatement. 409 `membership_exists` (déjà active pour cet e-mail) /
        `application_in_progress` · 412 `plan_full`.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MembershipApplicationInput" } } }
      responses:
        "201":
          {
            description: Demande enregistrée,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberMembership" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Adhésion ou demande existante }
        "412": { description: Formule complète }
        "422": { $ref: "#/components/responses/Validation" }
  /public/memberships/{membershipId}:
    parameters:
