  /organizations/{organizationId}/membership-plans/{planId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une formule
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Modifier une formule
