          }
        availabilities:
          {
            type: array,
            minItems: 1,
            items: { $ref: "#/components/schemas/AvailabilityRange" },
            description: "dans la fenêtre événement ± 24 h, plages disponibles sans chevauchement",
          }
        skills:
          {
            type: array,
            items:
              {
                type: object,
