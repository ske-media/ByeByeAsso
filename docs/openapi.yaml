          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    skillId: { type: string },
                    name: { type: string },
                    requiresVerification: { type: boolean },
                    verified: { type: boolean },
                  },
              },
          }
        buddies:
          {
            type: array,
            items: { type: object, properties: { email: { type: string }, reciprocal: { type: boolean } } },
          }
        answers:
          {
            type: array,
            items: { type: object, properties: { key: { type: string }, label: { type: string }, value: {} } },
