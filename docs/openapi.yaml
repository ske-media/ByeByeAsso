        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Check-list incomplète ou transition impossible }
  /organizations/{organizationId}/events/{eventId}/cancel:
