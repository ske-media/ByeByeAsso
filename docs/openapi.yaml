        required: { type: boolean }
        options: { type: array, items: { type: string } }
    VolunteeringSettingsInput:
      type: object
      properties:
        recruitmentStatus:
          { type: string, enum: [closed, open], description: "open exige ≥ 1 poste activé et un événement actif (412)" }
        targetCount: { type: integer }
        maxHoursPerDay: { type: integer, maximum: 24 }
        minRestMinutes: { type: integer, maximum: 1440 }
        questions:
          type: array
          maxItems: 12
          description: Remplace la liste (clé dérivée du libellé, réponses conservées par clé).
          items:
            type: object
            required: [label]
            properties:
              key: { type: string }
              label: { type: string }
              helpText: { type: string }
              type: { type: string, enum: [short_text, long_text, single_choice, checkbox] }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
