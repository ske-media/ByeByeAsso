openapi: 3.1.0
info:
  title: Kroov API
  version: 0.7.0-phase7
  description: |
    API `/api/v1` de Kroov. Authentification par cookie de session (Better Auth, `/api/auth/*`).
    Toute requête modifiante est vérifiée sur son origine (CSRF). Les erreurs ont la forme
    `{ "error": { "code", "message", "fieldErrors?", "details?" } }`.

    Codes : 400 `invalid_json` · 401 `unauthenticated` · 403 `forbidden` / `forbidden_origin` ·
    404 `not_found` · 409 `conflict` · 412 `precondition_failed` · 422 `validation_failed` · 500 `internal`.

    Idempotence : les lectures sont idempotentes ; `POST /organizations` et `POST …/invitations` sont
    protégés par unicité (slug, e-mail en attente) ; `POST /invitations/{token}/accept` est à usage unique
    (412 au second appel). Transactions : chaque commande écrit son journal d'audit dans la même transaction.

    Billetterie (phase 3) : les routes `/public/orders/*` sont authentifiées par le jeton d'accès acheteur
    (`?k=` ou `Authorization: Bearer`), renvoyé UNE fois à la réservation ; toute erreur d'accès est un 404.
    Les billets ne sont émis que par `POST /payments/webhooks/{provider}` (signature vérifiée, idempotent) ou
    pour une commande gratuite — jamais sur la redirection de retour du prestataire.

    Adhésions (phase 4) : les formules et adhésions appartiennent à l'organisation (`memberships.manage`).
    Les routes `/public/memberships/*` sont authentifiées par le jeton d'accès adhérent (`?k=` ou Bearer),
    renvoyé UNE fois à la demande ; l'activation d'une cotisation payante ne vient que du webhook signé.
    Un tarif `membersOnly` exige une adhésion active sur l'e-mail de la commande (412 `membership_required`).

    Bénévoles (phase 5) : catalogue (compétences, équipes, postes types) et candidatures sous `volunteers.review`,
    postes activés / créneaux / réglages sous `volunteers.schedule` (périmètre événement respecté). Les routes
    `/public/volunteer-applications/*` sont authentifiées par le jeton candidat (`?k=` ou Bearer), renvoyé UNE fois ;
    erreurs d'accès en 404 uniforme. Les notes internes ne sortent jamais des routes organisateur ; une déclaration
    de binôme ne révèle jamais si l'autre personne a candidaté.

    Planning (phase 6) : versions de planning par événement (`V1`, `V2`…) sous `volunteers.schedule`.
    Le moteur (`kroov-greedy-ls/1`, déterministe, journalisé dans `schedule-runs`) ne produit qu'une PROPOSITION ;
    seule la publication humaine (`POST …/publish`, jeton `expectedVersion`, 409 `stale_version`, 412 `conflicts` /
    `unfilled` / `version_immutable`) fait foi et notifie uniquement les bénévoles dont les missions changent.
    Les routes `/public/volunteer-applications/{id}/missions*` sont authentifiées par le jeton candidat.

    Contacts (phase 7) : base de contacts PAR ORGANISATION, jamais partagée (même adresse ailleurs = autre contact).
    Lecture `contacts.read`, écriture `contacts.manage`, export `contacts.export` (audité). Les fiches sont nourries
    par les commandes payées, adhésions, candidatures et missions publiées ; un achat ou une adhésion ne vaut
    JAMAIS consentement marketing (`customer_only` ≠ `opted_in`). Journal de consentement append-only, exclusions
    par adresse levées seulement avec motif, segments recalculés à chaque usage. Aucune route publique.

    Événements (phase 2) : les mutations portent `version` (concurrence optimiste, 409 `stale_version`).
    Publication : 412 `publication_blocked` avec `details.checklist` (clés manquantes). Les routes
    `/public/*` sont anonymes et ne servent que les événements publiés (brouillons = 404, jamais listés).
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kroov.session_token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            details: { type: object }
    Profile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        locale: { type: string, example: fr-FR }
        timezone: { type: string, example: Europe/Paris }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        legalForm: { type: string, enum: [association, company, collective, public_body, other] }
        country: { type: string, example: FR }
        timezone: { type: string }
        status: { type: string, enum: [active, suspended, archived] }
        createdAt: { type: string, format: date-time }
        settings:
          type: object
          properties:
            currency: { type: string, example: EUR }
            locale: { type: string }
            contactEmail: { type: [string, "null"] }
            website: { type: [string, "null"] }
    Role:
      type: string
      enum: [owner, organization_admin, event_manager, volunteer_manager, marketing_manager, ticketing_manager, scanner]
    RoleGrant:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        eventId:
          { type: string, format: uuid, description: "Périmètre événement (phase 2). Absent = organisation entière." }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        joinedAt: { type: string, format: date-time }
        grants:
          type: array
          items:
            type: object
            properties:
              role: { $ref: "#/components/schemas/Role" }
              roleName: { type: string }
              eventId: { type: [string, "null"] }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        roleName: { type: string }
        eventId: { type: [string, "null"] }
        eventTitle: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastSentAt: { type: string, format: date-time }
        invitedByName: { type: string }
    PublicInvitation:
      type: object
      properties:
        organizationName: { type: string }
        roleName: { type: string }
        eventTitle:
          { type: [string, "null"], description: "Titre de l'événement si l'invitation est limitée à un seul." }
        invitedByName: { type: string }
        emailHint: { type: string, example: "no••••@example.org" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
    EventStatus:
      type: string
      enum: [draft, published, suspended, completed, cancelled, archived]
    EventVisibility:
      type: string
      enum: [public, unlisted, private]
    EventLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addressLine1: { type: [string, "null"] }
        addressLine2: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        city: { type: string }
        country: { type: string, example: FR }
        accessNotes: { type: [string, "null"] }
    EventSettings:
      type: object
      properties:
        accessInfo: { type: [string, "null"] }
        programme: { type: [string, "null"] }
        contactEmail: { type: [string, "null"] }
        externalUrl: { type: [string, "null"] }
        showRemainingCapacity: { type: boolean }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        tagline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        doorsAt: { type: [string, "null"], format: date-time }
        timezone: { type: string, example: Europe/Paris }
        capacity: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/EventStatus" }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        location: { oneOf: [{ $ref: "#/components/schemas/EventLocation" }, { type: "null" }] }
        settings: { $ref: "#/components/schemas/EventSettings" }
    EventListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        capacity: { type: integer }
        locationName: { type: [string, "null"] }
        city: { type: [string, "null"] }
    EventWrite:
      type: object
      description: Corps de création (tous requis sauf mention) ; en PATCH tous optionnels + `version` requis.
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        slug: { type: string, description: "Optionnel : dérivé du titre (suffixe en cas de doublon)." }
        tagline: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 20000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "Strictement après startsAt, ≤ 31 jours." }
        doorsAt: { type: string, format: date-time, description: "≤ startsAt." }
        timezone: { type: string, default: Europe/Paris }
        capacity: { type: integer, minimum: 0, default: 0 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        locationId: { type: string, format: uuid, description: "Lieu de la même organisation (404 sinon)." }
        settings: { $ref: "#/components/schemas/EventSettings" }
    PublicOrganization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        legalForm: { type: string }
        timezone: { type: string }
        contactEmail: { type: [string, "null"] }
        website: { type: [string, "null"] }
    PublicEventCard:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        tagline: { type: [string, "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        locationName: { type: [string, "null"] }
        city: { type: [string, "null"] }
    PublicEvent:
      description: Même forme que `Event` sans `organizationId` ni `version`, avec `organization`.
      allOf:
        - { $ref: "#/components/schemas/Event" }
        - type: object
          properties:
            organization: { $ref: "#/components/schemas/PublicOrganization" }
    TicketType:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer, minimum: 0, description: "0 = gratuit (ni frais ni paiement)" }
        currency: { type: string }
        quota: { type: [integer, "null"] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
        minPerOrder: { type: integer }
        maxPerOrder: { type: integer }
        hidden: { type: boolean }
        membersOnly:
          {
            type: boolean,
            description: "réservé aux adhérents actifs (vérifié à la réservation, aux coordonnées et au paiement)",
          }
        position: { type: integer }
        status: { type: string, enum: [active, archived] }
        poolId: { type: [string, "null"] }
        poolName: { type: [string, "null"] }
        sold: { type: integer }
        held: { type: integer }
        available: { type: [integer, "null"], description: "null = illimité" }
    TicketTypeWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        quota: { type: [integer, "null"] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
        minPerOrder: { type: integer, minimum: 1, maximum: 50 }
        maxPerOrder: { type: integer, minimum: 1, maximum: 50 }
        hidden: { type: boolean }
        position: { type: integer }
        poolId: { type: [string, "null"], format: uuid }
    TicketingSettings:
      type: object
      properties:
        ticketingStatus: { type: string, enum: [not_configured, open, closed] }
        maxTicketsPerOrder: { type: integer }
        salesCloseAt: { type: [string, "null"], format: date-time }
        nominativeTickets: { type: boolean }
        capacity: { type: integer }
        currency: { type: string }
    OrderStatus:
      type: string
      enum: [draft, reserved, awaiting_payment, paid, failed, expired, partially_refunded, refunded]
    TicketStatus:
      type: string
      enum: [pending, valid, used, revoked, refunded]
    OrderTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: KR-1048-01 }
        attendeeName: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TicketStatus" }
        typeLabel: { type: string }
        ticketTypeId: { type: string, format: uuid }
        priceMinor: { type: integer }
        feeMinor: { type: integer }
        usedAt: { type: [string, "null"], format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: KR-1048 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationSlug: { type: string }
        event:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            title: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string }
            locationName: { type: [string, "null"] }
            city: { type: [string, "null"] }
            nominativeTickets: { type: boolean }
        buyer:
          type: object
          properties:
            email: { type: string }
            firstName: { type: [string, "null"] }
            lastName: { type: [string, "null"] }
            userId: { type: [string, "null"] }
        currency: { type: string }
        subtotalMinor: { type: integer }
        discountMinor: { type: integer }
        feesMinor: { type: integer }
        totalMinor: { type: integer, description: "= subtotal − discount + fees" }
        promoCode: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              ticketTypeId: { type: string }
              label: { type: string }
              quantity: { type: integer }
              unitPriceMinor: { type: integer }
              unitFeeMinor: { type: integer }
        tickets: { type: array, items: { $ref: "#/components/schemas/OrderTicket" } }
        payment:
          type: [object, "null"]
          properties:
            id: { type: string }
            status: { type: string }
            provider: { type: string, enum: [stripe, fake] }
            methodLabel: { type: [string, "null"] }
            amountMinor: { type: integer }
            refundedMinor: { type: integer }
            failureReason: { type: [string, "null"] }
        refunds:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              amountMinor: { type: integer }
              reason: { type: string }
              status: { type: string, enum: [pending, succeeded, failed] }
              createdAt: { type: string, format: date-time }
              ticketIds: { type: array, items: { type: string } }
        history:
          type: array
          items: { type: object, properties: { at: { type: string, format: date-time }, label: { type: string } } }
    BuyerOrder:
      description: "`Order` + `accessToken` (renvoyé à la réservation et sur les lectures acheteur) + `ticketLinks` (id billet → jeton de page billet)."
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            accessToken: { type: string }
            ticketLinks: { type: object, additionalProperties: { type: string } }
    OrderListItem:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        eventId: { type: string }
        eventTitle: { type: string }
        buyerEmail: { type: string }
        buyerName: { type: string }
        ticketsSummary: { type: string, example: "2 × Standard" }
        ticketCount: { type: integer }
        totalMinor: { type: integer }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
    TicketingStats:
      type: object
      properties:
        paidTickets: { type: integer }
        grossRevenueMinor: { type: integer, description: "billets payés, remises déduites, hors frais" }
        refundedMinor: { type: integer }
        pendingOrders: { type: integer }
        admitted: { type: integer }
        currency: { type: string }
    PublicTicketType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer }
        unitFeeMinor: { type: integer, description: "frais acheteur par billet, annoncés avant paiement" }
        membersOnly: { type: boolean }
        currency: { type: string }
        minPerOrder: { type: integer }
        maxPerOrder: { type: integer }
        available: { type: [integer, "null"] }
        saleState: { type: string, enum: [upcoming, on_sale, ended, sold_out] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
    PublicTicketing:
      type: object
      properties:
        open: { type: boolean }
        closedReason: { type: [string, "null"] }
        maxTicketsPerOrder: { type: integer }
        nominativeTickets: { type: boolean }
        currency: { type: string }
        types: { type: array, items: { $ref: "#/components/schemas/PublicTicketType" } }
    TicketPage:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        attendeeName: { type: [string, "null"] }
        typeLabel: { type: string }
        priceMinor: { type: integer }
        currency: { type: string }
        qrCredential:
          {
            type: [string, "null"],
            description: "identifiant opaque à encoder en QR ; null sauf billet valide/utilisé",
          }
        usedAt: { type: [string, "null"], format: date-time }
        order:
          { type: object, properties: { id: { type: string }, number: { type: string }, buyerName: { type: string } } }
        event: { type: object }
        organization: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        siblings: { type: array, items: { type: object } }
    ScanOutcome:
      type: object
      properties:
        result: { type: string, enum: [accepted, already_used, revoked, refunded, invalid] }
        ticket:
          {
            type: [object, "null"],
            properties:
              { number: { type: string }, attendeeName: { type: [string, "null"] }, typeLabel: { type: string } },
          }
        firstScan:
          {
            type: [object, "null"],
            properties: { at: { type: string, format: date-time }, byName: { type: [string, "null"] } },
          }
        scannedAt: { type: string, format: date-time }
        counters: { type: object, properties: { admitted: { type: integer }, valid: { type: integer } } }
    PaymentAccount:
      type: object
      properties:
        provider: { type: string, enum: [stripe, fake] }
        providerAccountId: { type: string }
        status: { type: string, enum: [pending, active, restricted, disconnected] }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        lastSyncedAt: { type: [string, "null"], format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: member.roles_changed }
        actorKind: { type: string }
        actorId: { type: [string, "null"] }
        targetType: { type: string }
        targetId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
    MembershipPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor:
          { type: integer, minimum: 0, description: "0 = adhésion gratuite (activation immédiate à l'approbation)" }
        currency: { type: string }
        periodKind: { type: string, enum: [fixed, rolling] }
        validFrom: { type: [string, "null"], format: date-time, description: période fixe }
        validUntil: { type: [string, "null"], format: date-time, description: période fixe }
        durationMonths: { type: [integer, "null"], description: période glissante }
        requiresReview: { type: boolean }
        maxMembers: { type: [integer, "null"] }
        public: { type: boolean }
        position: { type: integer }
        status: { type: string, enum: [active, archived] }
        benefits: { type: array, items: { type: string } }
        taken: { type: integer, description: "actives + en cours (compte dans le quota)" }
        activeMembers: { type: integer }
    MembershipPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        periodKind: { type: string, enum: [fixed, rolling] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        durationMonths: { type: integer, minimum: 1, maximum: 60 }
        requiresReview: { type: boolean }
        maxMembers: { type: [integer, "null"] }
        public: { type: boolean }
        position: { type: integer }
        benefits: { type: array, items: { type: string }, maxItems: 12 }
    Membership:
      type: object
      description: Vue organisateur d'une adhésion (jamais de jeton ni de hash).
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationSlug: { type: string }
        number: { type: string, example: M-0001 }
        status: { type: string, enum: [pending, awaiting_payment, active, rejected, suspended, expired, cancelled] }
        plan:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            periodKind: { type: string, enum: [fixed, rolling] }
            requiresReview: { type: boolean }
        member:
          type: object
          properties:
            email: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            userId: { type: [string, "null"] }
        priceMinor: { type: integer }
        feesMinor: { type: integer, description: frais de service annoncés avant paiement }
        currency: { type: string }
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
