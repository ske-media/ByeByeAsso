    get:
      {
        summary: Codes promo et nombre d'utilisations,
        description: "`tickets.manage`.",
        responses: { "200": { description: OK } },
      }
    post:
      summary: Créer un code
      description: "`tickets.manage`. { code, kind: percent|amount, value (points de base | unités mineures), maxRedemptions?, validFrom?, validUntil? }."
      responses: { "201": { description: Créé }, "409": { description: Code déjà utilisé } }
  /organizations/{organizationId}/events/{eventId}/promo-codes/{promoCodeId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: promoCodeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch: { summary: "Activer / désactiver { active }", responses: { "204": { description: OK } } }
  /organizations/{organizationId}/orders:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Commandes de l'organisation (+ indicateurs)
      description: "`orders.read` (périmètre événement respecté). Les réservations abandonnées sans coordonnées sont omises."
      parameters:
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders: { type: array, items: { $ref: "#/components/schemas/OrderListItem" } }
                      stats: { $ref: "#/components/schemas/TicketingStats" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/{organizationId}/orders/{orderId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une commande (organisateur)
      description: "`orders.read` au périmètre de l'événement de la commande ; 404 sinon. Jamais de liens acheteur."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/orders/{orderId}/refunds:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Rembourser (total ou par billets)
      description: |
        `orders.refund`. Corps `{ full: true } | { ticketIds: [...] }` + `reason` (3–500 caractères).
        Montant = prix − part de remise + frais de chaque billet ; jamais plus que encaissé − déjà remboursé
        (verrou sur le paiement). Billets → `refunded` (places libérées), ledger, audit, e-mail à l'acheteur.
        Commande gratuite : remboursement direct ; sinon via le prestataire (reverse transfer + commission).
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412":
          { description: "order_not_refundable · already_refunded · refund_exceeds_payment · provider_refund_failed" }
  /organizations/{organizationId}/orders/{orderId}/resend:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Renvoyer les billets
      description: "`orders.read`. Les jetons des liens sont renouvelés : les anciens liens cessent de fonctionner."
      responses: { "204": { description: Envoyé }, "412": { description: Commande non payée } }
  /organizations/{organizationId}/events/{eventId}/checkins:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Contrôler un billet (scan)
      description: |
        `checkins.scan` sur CET événement. Corps `{ credential, device? }`. Admission atomique
        (`UPDATE … WHERE status = 'valid'` + unique partiel). Un billet d'un autre événement ou un code
        inconnu → `invalid` sans divulgation. Chaque tentative est journalisée.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ScanOutcome" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/{organizationId}/events/{eventId}/checkins/summary:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      {
        summary: Compteurs et derniers contrôles,
        description: "`checkins.scan`.",
        responses: { "200": { description: OK } },
      }
