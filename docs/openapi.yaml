      summary: Modifier vœux, disponibilités, compétences, binôme, contraintes, téléphone
      description: Tant que la candidature n'est pas affectée ni close (412 `not_editable`). `status` et notes ignorés.
      security: []
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/CandidateEditableInput" } } },
        }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Non modifiable }
        "422": { $ref: "#/components/responses/Validation" }
  /public/volunteer-applications/{applicationId}/withdraw:
    parameters:
      - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: k, in: query, required: true, schema: { type: string } }
    post:
      summary: Retirer sa candidature (définitif)
      security: []
      requestBody:
        {
          required: false,
          content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } },
        }
      responses:
        "200": { description: Retirée }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Déjà close }
  /organizations/{organizationId}/events/{eventId}/schedule-versions:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Versions de planning de l'événement (volunteers.schedule)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { versions: { type: array, items: { $ref: "#/components/schemas/ScheduleVersion" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer une version de travail (optionnellement à partir d'une autre)
      description: Numérotée `V(n+1)` ; `basedOnVersionId` copie les affectations de la version source (verrous conservés).
      requestBody:
        {
          required: false,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        { basedOnVersionId: { type: string, format: uuid }, notes: { type: string, maxLength: 2000 } },
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Créée,
            content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleVersion" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une version (créneaux, affectations, candidats, exclusions expliquées, conflits, charge)
      responses:
        "200":
          { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VersionDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/generate:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Lancer le moteur sur la version (proposition, jamais publication)
      description: |
        Remplace les affectations NON verrouillées des créneaux visés (`shiftIds` = régénération partielle ;
        absent = tout l'événement). Chaque exécution est journalisée (`schedule-runs`) avec l'instantané d'entrée
        et son empreinte. Version requise en `draft` / `proposed` / `generation_failed` / `under_review`
        (412 `version_immutable` sinon).
      requestBody:
        {
          required: false,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          shiftIds: { type: array, items: { type: string, format: uuid } },
                          weights: { $ref: "#/components/schemas/EngineWeights" },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          description: Proposition produite
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { $ref: "#/components/schemas/ScheduleVersion" }
                  run: { $ref: "#/components/schemas/ScheduleRun" }
        "412": { description: version_immutable }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/diff:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - {
          name: against,
          in: query,
          required: false,
          schema: { type: string, format: uuid },
          description: "version de comparaison (défaut : version publiée)",
        }
    get:
      summary: Différences avec une autre version (ce qui changerait pour chaque bénévole)
      responses:
        "200":
          { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VersionDiff" } } } }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/review:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Passer la version en arbitrage (proposed → under_review)
      responses:
        "200": { description: OK }
        "409": { description: invalid_transition }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/publish:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Publier la version (décision humaine, transactionnelle)
      description: |
        Sous verrou de l'événement : revalide chaque affectation sur les DONNÉES ACTUELLES (412 `conflicts` +
        `details.conflicts`), exige `acknowledgeUnfilled` si des besoins restent non pourvus (412 `unfilled`),
        vérifie `expectedVersion` (409 `stale_version`), remplace la version publiée précédente (`superseded`),
        passe les candidatures en `assigned`, conserve les confirmations des missions inchangées et n'envoie
        un e-mail qu'aux bénévoles dont les missions changent (lignes NOUVEAU / RETIRÉ). Deux publications
        concurrentes : une seule aboutit.
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishInput" } } } }
      responses:
        "200":
          description: Publiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { $ref: "#/components/schemas/ScheduleVersion" }
                  supersededVersionId: { type: [string, "null"], format: uuid }
                  notified: { type: integer }
                  changes: { type: integer }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: "conflicts · unfilled · version_immutable" }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/assignments:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Affecter manuellement (contraintes dures vérifiées, 412 avec la raison lisible)
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [shiftId, applicationId],
                      properties:
                        {
                          shiftId: { type: string, format: uuid },
                          applicationId: { type: string, format: uuid },
                          lock: { type: boolean, default: false },
                        },
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Affectée,
            content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } },
          }
        "409": { description: Déjà affecté·e sur ce créneau }
        "412": { description: "Contrainte dure violée (`details.reason`, libellé) ou version immuable" }
  /organizations/{organizationId}/events/{eventId}/schedule-versions/{versionId}/assignments/{assignmentId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
