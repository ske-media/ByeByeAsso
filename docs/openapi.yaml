                  isPrimary: { type: boolean }
            consents: { type: array, items: { $ref: "#/components/schemas/ConsentRecord" } }
            suppression:
              oneOf:
                - type: object
                  properties:
                    id: { type: string, format: uuid }
                    reason: { $ref: "#/components/schemas/SuppressionReason" }
                    note: { type: [string, "null"] }
                    createdAt: { type: string, format: date-time }
                - { type: "null" }
            notes:
              type: array
              description: "Notes internes — uniquement dans les routes organisateur"
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  body: { type: string }
                  pinned: { type: boolean }
                  author: { type: [string, "null"] }
                  createdAt: { type: string, format: date-time }
            orders: { type: array, items: { type: object } }
            memberships: { type: array, items: { type: object } }
            applications: { type: array, items: { type: object } }
            missions: { type: array, items: { type: object } }
            merges: { type: array, items: { type: object } }
            timeline:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: [order, membership, application, mission, consent, merge] }
                  title: { type: string }
                  detail: { type: [string, "null"] }
                  href: { type: [string, "null"] }
    ConsentRecord:
      type: object
      description: "Append-only : jamais modifié ni supprimé"
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [granted, withdrawn] }
        basis: { type: string, enum: [explicit_opt_in, customer_exception, manual, import] }
        source: { $ref: "#/components/schemas/CrmSource" }
        evidence: { type: string, description: "preuve lisible (case cochée sur la commande X, bulletin papier…)" }
        occurredAt: { type: string, format: date-time }
        recordedBy: { type: [string, "null"] }
    ManualConsentInput:
      type: object
      required: [status, evidence]
      properties:
        status: { type: string, enum: [granted, withdrawn] }
        evidence: { type: string, minLength: 5, maxLength: 1000 }
        occurredAt: { type: string, format: date-time }
    ContactTag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        color: { type: string, enum: [lime, lavender, orange, pink, neutral] }
        count: { type: integer, description: "contacts actifs portant l'étiquette (listes)" }
    ContactStats:
      type: object
      properties:
        total: { type: integer }
        optedIn: { type: integer }
        customerOnly: { type: integer }
        suppressed: { type: integer }
        newLast30Days: { type: integer }
        withAccount: { type: integer }
    SuppressionReason:
      type: string
      enum: [unsubscribed, bounced, complaint, manual, erased]
    Suppression:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        reason: { $ref: "#/components/schemas/SuppressionReason" }
        source: { $ref: "#/components/schemas/CrmSource" }
        note: { type: [string, "null"] }
        createdBy: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        liftedAt: { type: [string, "null"], format: date-time }
        liftReason: { type: [string, "null"] }
    SegmentRule:
      oneOf:
        - type: object
          required: [type, tagIds]
          properties:
            type: { const: tag }
            op: { type: string, enum: [in, not_in], default: in }
            tagIds: { type: array, items: { type: string, format: uuid } }
        - type: object
          required: [type, statuses]
          properties:
            type: { const: marketing_email }
            statuses: { type: array, items: { $ref: "#/components/schemas/MarketingEmailStatus" } }
        - type: object
          required: [type, eventIds]
          properties:
            type: { const: event }
            relation: { type: string, enum: [ordered, attended, volunteered, assigned], default: ordered }
            eventIds: { type: array, items: { type: string, format: uuid } }
        - type: object
          required: [type]
          properties:
            type: { const: membership }
            state: { type: string, enum: [active, expired, never, any], default: active }
            planIds: { type: array, items: { type: string, format: uuid } }
        - type: object
          required: [type]
          properties:
            type: { const: orders }
            minCount: { type: integer }
            minTotalMinor: { type: integer }
        - type: object
          required: [type]
          properties:
            type: { const: activity }
            after: { type: string, format: date-time }
            before: { type: string, format: date-time }
        - type: object
          required: [type, sources]
          properties:
            type: { const: source }
            sources: { type: array, items: { $ref: "#/components/schemas/CrmSource" } }
        - type: object
          required: [type, q]
          properties:
            type: { const: search }
            q: { type: string }
    SegmentDefinition:
      type: object
      description: "Règles combinées en ET (all) ou OU (any) ; toute référence (étiquette, événement, formule) doit appartenir à l'organisation (422 sinon)"
      properties:
        match: { type: string, enum: [all, any], default: all }
        rules: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SegmentRule" } }
    Segment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string, enum: [dynamic, static] }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
        memberCount: { type: [integer, "null"], description: "dernier calcul (dynamique) ou membres (statique)" }
        computedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SegmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string }
        description: { type: string, maxLength: 500 }
        kind: { type: string, enum: [dynamic, static], default: dynamic }
        definition: { $ref: "#/components/schemas/SegmentDefinition" }
    SegmentEvaluation:
      type: object
      properties:
        count: { type: integer }
        consented: { type: integer, description: "parmi les correspondants, ceux en opted_in" }
        sample:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    id: { type: string },
                    email: { type: string },
                    name: { type: string },
                    marketingEmailStatus: { $ref: "#/components/schemas/MarketingEmailStatus" },
                  },
              },
          }
        computedAt: { type: string, format: date-time }
  responses:
    Unauthenticated:
      {
        description: Connexion requise,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Forbidden:
      {
        description: Permission refusée ou origine non autorisée,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    NotFound:
      {
        description: Introuvable (ou non membre — l'existence n'est pas divulguée),
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Validation:
      {
        description: Valeurs invalides,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    StaleVersion:
      {
        description: "409 stale_version — l'événement a été modifié entre-temps ; rechargez.",
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    EventData:
      {
        description: OK,
        content:
          {
            application/json:
              { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Event" } } } },
          },
      }
security:
  - session: []
paths:
  /profiles/me:
    get:
      summary: Profil de l'utilisateur connecté
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Profile" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      summary: Modifier son profil
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                timezone: { type: string }
                phone: { type: string, maxLength: 30 }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations:
    get:
      summary: Organisations dont je suis membre actif
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  {
                                    allOf:
                                      [
                                        { $ref: "#/components/schemas/Organization" },
                                        {
                                          type: object,
                                          properties:
                                            { roles: { type: array, items: { $ref: "#/components/schemas/Role" } } },
                                        },
                                      ],
                                  },
                              },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Créer une organisation (l'appelant devient propriétaire)
      description: Audit `organization.created`. Transaction unique (organisation, réglages, membre, rôle, audit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?$" }
                legalForm:
                  { type: string, enum: [association, company, collective, public_body, other], default: association }
                country: { type: string, default: FR }
                timezone: { type: string, default: Europe/Paris }
      responses:
        "201":
          {
            description: Créée (en-tête Location),
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Organization" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Slug déjà utilisé }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lire une organisation
      description: Permission `organization.read`. Les non-membres reçoivent 404.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Organization" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    patch:
      summary: Modifier une organisation et ses réglages
      description: Permission `organization.manage`. Audit `organization.updated`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                legalForm: { type: string }
                country: { type: string }
                timezone: { type: string }
                settings:
                  type: object
                  properties:
                    contactEmail: { type: string }
                    website: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/members:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Membres actifs et leurs rôles
      description: Permission `organization.read`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Member" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Retirer un membre
      description: |
        Permission `members.manage` ; retirer un propriétaire exige d'être propriétaire ; le dernier propriétaire
        ne peut pas être retiré (412 `last_owner`). Verrou sur la ligne organisation. Audit `member.removed`.
      parameters:
        - { name: reason, in: query, schema: { type: string } }
      responses:
        "204": { description: Retiré }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Dernier propriétaire }
  /organizations/{organizationId}/members/{memberId}/roles:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Remplacer les rôles d'un membre
      description: |
        Permission `members.manage` ; accorder ou retirer `owner` exige d'être propriétaire ; protection du
        dernier propriétaire (412). Remplacement atomique. Audit `member.roles_changed` (avant/après, motif).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RoleGrant" } }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Member" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Dernier propriétaire }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/invitations:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Invitations (toutes, 200 dernières)
      description: Permission `members.invite`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Invitation" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Inviter une adresse avec un rôle
      description: |
        Permission `members.invite` (rôle `owner` : propriétaire uniquement). 409 si déjà membre ou invitation en
        attente. Jeton 256 bits envoyé par e-mail, seul son SHA-256 est stocké ; expiration 7 jours. Audit `invitation.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                eventId: { type: string, format: uuid }
      responses:
        "201":
          {
            description: Créée,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Invitation" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Déjà membre ou invitation en attente }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Annuler une invitation en attente
      description: Permission `members.invite`. Audit `invitation.revoked`.
      responses:
        "204": { description: Annulée }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/invitations/{invitationId}/resend:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Renvoyer une invitation (nouveau jeton, nouvelle expiration)
      description: Permission `members.invite`. 412 si acceptée ou annulée. Audit `invitation.resent`.
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { description: Invitation close }
  /organizations/{organizationId}/audit:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Journal d'audit (50 dernières entrées)
      description: Permission `organization.manage`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /invitations/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: Métadonnées publiques d'une invitation
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicInvitation" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      summary: Accepter une invitation avec le compte connecté
      description: |
        E-mail du compte vérifié et identique à l'adresse invitée (403 sinon). 412 si expirée, déjà utilisée ou
        e-mail non vérifié. Usage unique (verrou `FOR UPDATE`). Audit `invitation.accepted`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                properties: { organizationId: { type: string }, organizationSlug: { type: string } },
                              },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Expirée, close ou e-mail non vérifié }

  # ----------------------------------------------------------------------------------------------
  # Phase 2 — événements, lieux, lecture publique
  # ----------------------------------------------------------------------------------------------
  /organizations/{organizationId}/events:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lister les événements (toute l'organisation, ou seulement ceux attribués)
      description: |
        `events.read`. Un membre dont les droits sont limités à certains événements ne voit que ceux-là.
        `status=active` (défaut : brouillons + publiés + suspendus) · `all` · ou un statut précis.
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, all, draft, published, suspended, completed, cancelled, archived] },
          }
        - { name: q, in: query, schema: { type: string }, description: Recherche sur le titre }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/EventListItem" } } },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer un événement (brouillon)
      description: "`events.create`. Slug dérivé du titre si absent. Audit `event.created`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventWrite" } } }
      responses:
        "201": { $ref: "#/components/responses/EventData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Lieu inconnu dans cette organisation }
        "409": { description: Slug déjà utilisé (si fourni explicitement) }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/events/{eventId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'un événement
      description: "`events.read` au périmètre de l'événement ; 404 hors périmètre (existence non divulguée)."
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Modifier un événement
      description: |
        `events.update`. Corps : champs de `EventWrite` (tous optionnels) + `version` (requis).
        Un événement publié dont les dates ou le lieu changent émet `event.logistics_changed` (outbox).
        Un événement archivé n'est plus modifiable (412). Audit `event.updated` avec le diff des champs.
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Événement archivé ou lieu archivé }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      summary: Supprimer un brouillon
      description: "`events.update`. Brouillons uniquement (412 sinon) ; un événement publié s'annule puis s'archive. Audit `event.deleted`."
      responses:
        "204": { description: Supprimé }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Pas un brouillon }
  /organizations/{organizationId}/events/{eventId}/publish:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Publier
      description: |
        `events.publish`. Corps `{ version }`. Transition `draft → published` gardée par la check-list
        (titre, description ≥ 20 caractères, dates cohérentes et futures, lieu, capacité > 0) et par le
        statut actif de l'organisation (verrou `FOR UPDATE`). 412 `publication_blocked` avec
        `details.checklist` ; outbox `event.published` ; audit `event.published`.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { type: object, required: [version], properties: { version: { type: integer } } } },
          }
      responses:
