                {
                  type: string,
                  enum:
                    [
                      not_available,
                      missing_skill,
                      unverified_skill,
                      too_young,
                      overlap,
                      rest_too_short,
                      max_hours,
                      shift_full,
                      not_eligible,
                    ],
                }
