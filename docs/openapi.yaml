    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Compte de paiement connecté
      description: "`organization.manage`. `data: null` sans compte."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { oneOf: [{ $ref: "#/components/schemas/PaymentAccount" }, { type: "null" }] } },
                      },
                  },
              },
          }
    post: { summary: Resynchroniser l'état depuis le prestataire, responses: { "200": { description: OK } } }
  /organizations/{organizationId}/payment-account/onboarding-link:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Créer le compte connecté si besoin et obtenir l'URL d'inscription hébergée
      description: "`organization.manage`. Stripe : Account Link Express. Fournisseur simulé : compte actif immédiatement."
      responses: { "200": { description: "{ onboardingUrl, account }" } }
  /public/organizations/{slug}/events/{eventSlug}/ticket-types:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: eventSlug, in: path, required: true, schema: { type: string } }
    get:
      summary: Tarifs visibles et disponibilité en direct
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicTicketing" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/orders:
    post:
      summary: Réserver des places (10 minutes)
      description: |
        Anonyme ou connecté. Corps `{ organizationSlug, eventSlug, items: [{ ticketTypeId, quantity }] }`.
        Sous verrou (organisation → événement) : aucune survente. Renvoie la commande `reserved` avec son
        `accessToken` — seule réponse qui le contient. 412 `insufficient_inventory` / `ticketing_closed` /
        `not_on_sale` / `quantity_out_of_range` / `max_per_order`.
      security: []
      responses:
        "201":
          {
            description: Réservée,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BuyerOrder" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Indisponible }
        "422": { $ref: "#/components/responses/Validation" }
  /public/orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: k, in: query, schema: { type: string }, description: Jeton d'accès acheteur (ou Authorization Bearer) }
    get:
      summary: Lecture acheteur
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BuyerOrder" } } } },
              },
          }
        "404": { description: Jeton absent ou invalide (uniforme) }
    patch:
      summary: Coordonnées, participants, consentement
      description: "Tant que la commande n'est pas payée ni expirée. `status` n'est pas modifiable."
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                attendees:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        properties: { ticketTypeId: { type: string }, names: { type: array, items: { type: string } } },
                      },
                  }
                marketingOptIn: { type: boolean }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: order_locked · order_expired }
        "422": { $ref: "#/components/responses/Validation" }
  /public/orders/{orderId}/checkout:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: k, in: query, schema: { type: string } }
    post:
      summary: Démarrer le paiement
      description: |
        Gratuit → `{ kind: "paid" }` (billets émis). Sinon crée la session hébergée du prestataire sur le compte
        connecté de l'organisation et renvoie `{ kind: "redirect", url }` ; la commande passe `awaiting_payment`
        et la réservation est prolongée de 10 minutes. 412 `buyer_details_required` / `attendees_required` /
        `payment_account_unavailable`.
      security: []
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Préconditions }
