    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Renommer / recolorer
      responses: { "200": { description: OK } }
    delete:
      summary: Supprimer (les affectations suivent)
      responses: { "204": { description: Supprimée } }
  /organizations/{organizationId}/suppressions:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: scope, in: query, schema: { type: string, enum: [active, all], default: active } }
    get:
      summary: Liste d'exclusion (consultable sans réinscrire personne)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { suppressions: { type: array, items: { $ref: "#/components/schemas/Suppression" } } },
                      },
                  },
              },
          }
    post:
      summary: "Exclure une adresse (contacts.manage ; phase 8 : désinscription et rebonds par le système). Idempotent."
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email],
                      properties:
                        {
                          email: { type: string, format: email },
                          reason: { $ref: "#/components/schemas/SuppressionReason" },
                          note: { type: string },
                        },
                    },
                },
            },
        }
      responses:
        "201": { description: "{ id, created }" }
  /organizations/{organizationId}/suppressions/{suppressionId}/lift:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: suppressionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Lever une exclusion — motif obligatoire, tracé (jamais automatique)"
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } },
                },
            },
        }
      responses:
        "200": { description: Levée }
        "412": { description: Déjà levée }
  /organizations/{organizationId}/segments:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Segments (non archivés)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { segments: { type: array, items: { $ref: "#/components/schemas/Segment" } } },
                      },
                  },
              },
          }
    post:
      summary: "Créer un segment (contacts.manage) ; un segment dynamique est calculé immédiatement"
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SegmentInput" } } } }
      responses:
        "201":
          { description: Créé, content: { application/json: { schema: { $ref: "#/components/schemas/Segment" } } } }
        "422": { description: Référence hors organisation (étiquette, événement, formule) }
  /organizations/{organizationId}/segments/preview:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Évaluer une définition maintenant (contacts.read)"
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/SegmentDefinition" } } },
        }
      responses:
        "200":
          {
            description: OK,
            content: { application/json: { schema: { $ref: "#/components/schemas/SegmentEvaluation" } } },
          }
        "422": { description: Référence hors organisation }
  /organizations/{organizationId}/segments/{segmentId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Segment + évaluation (dynamique : recalcul ; statique : membres)"
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Modifier (version = jeton optimiste)
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/StaleVersion" }
    delete:
      summary: Archiver
      responses: { "204": { description: Archivé } }
  /organizations/{organizationId}/segments/{segmentId}/{action}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [evaluate, members] } }
    post:
      summary: "evaluate (recalcul et mémorisation du nombre) · members ({ add, remove } sur un segment statique, 412 sinon)"
      responses:
        "200": { description: OK }
        "412": { description: Les membres d'un segment dynamique sont calculés }
  /organizations/{organizationId}/crm/rebuild:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Rejouer tout l'historique (commandes, adhésions, candidatures) dans la base — idempotent, audité"
      responses:
        "200": { description: "{ touched, skipped }" }
  /payments/webhooks/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [stripe, fake] } }
    post:
      summary: Webhook du prestataire de paiement
      description: |
        Serveur → serveur : pas de session ni de vérification d'origine ; la signature sur le corps BRUT
        (`Stripe-Signature` / `X-Kroov-Signature`) authentifie l'appel. Idempotent par (provider, event id) ;
        hors séquence et paiements tardifs résolus sous verrou de la commande. 200 `{ received, outcome }`,
        400 signature invalide, 404 prestataire non configuré, 500 → le prestataire réessaie.
      security: []
      responses:
        "200": { description: Reçu }
        "400": { description: Signature invalide }
        "404": { description: Prestataire inconnu }
  /payments/fake/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: "Fournisseur simulé (développement / test) : données de la session"
      security: []
      responses: { "200": { description: OK }, "404": { description: Hors environnement de test } }
    post:
      summary: "Fournisseur simulé : régler la session { decision: succeeded | failed } et livrer le webhook signé"
      security: []
      responses:
        {
          "200": { description: "{ status, webhookStatus, outcome, redirectUrl }" },
          "404": { description: Hors environnement de test },
        }
