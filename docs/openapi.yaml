openapi: 3.1.0
info:
  title: Kroov API
  version: 0.4.0-phase4
  description: |
    API `/api/v1` de Kroov. Authentification par cookie de session (Better Auth, `/api/auth/*`).
    Toute requête modifiante est vérifiée sur son origine (CSRF). Les erreurs ont la forme
    `{ "error": { "code", "message", "fieldErrors?", "details?" } }`.

    Codes : 400 `invalid_json` · 401 `unauthenticated` · 403 `forbidden` / `forbidden_origin` ·
    404 `not_found` · 409 `conflict` · 412 `precondition_failed` · 422 `validation_failed` · 500 `internal`.

    Idempotence : les lectures sont idempotentes ; `POST /organizations` et `POST …/invitations` sont
    protégés par unicité (slug, e-mail en attente) ; `POST /invitations/{token}/accept` est à usage unique
    (412 au second appel). Transactions : chaque commande écrit son journal d'audit dans la même transaction.

    Billetterie (phase 3) : les routes `/public/orders/*` sont authentifiées par le jeton d'accès acheteur
    (`?k=` ou `Authorization: Bearer`), renvoyé UNE fois à la réservation ; toute erreur d'accès est un 404.
    Les billets ne sont émis que par `POST /payments/webhooks/{provider}` (signature vérifiée, idempotent) ou
    pour une commande gratuite — jamais sur la redirection de retour du prestataire.

    Adhésions (phase 4) : les formules et adhésions appartiennent à l'organisation (`memberships.manage`).
    Les routes `/public/memberships/*` sont authentifiées par le jeton d'accès adhérent (`?k=` ou Bearer),
    renvoyé UNE fois à la demande ; l'activation d'une cotisation payante ne vient que du webhook signé.
    Un tarif `membersOnly` exige une adhésion active sur l'e-mail de la commande (412 `membership_required`).

    Événements (phase 2) : les mutations portent `version` (concurrence optimiste, 409 `stale_version`).
    Publication : 412 `publication_blocked` avec `details.checklist` (clés manquantes). Les routes
    `/public/*` sont anonymes et ne servent que les événements publiés (brouillons = 404, jamais listés).
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kroov.session_token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            details: { type: object }
    Profile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        locale: { type: string, example: fr-FR }
        timezone: { type: string, example: Europe/Paris }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        legalForm: { type: string, enum: [association, company, collective, public_body, other] }
        country: { type: string, example: FR }
        timezone: { type: string }
        status: { type: string, enum: [active, suspended, archived] }
        createdAt: { type: string, format: date-time }
        settings:
          type: object
          properties:
            currency: { type: string, example: EUR }
            locale: { type: string }
            contactEmail: { type: [string, "null"] }
            website: { type: [string, "null"] }
    Role:
      type: string
      enum: [owner, organization_admin, event_manager, volunteer_manager, marketing_manager, ticketing_manager, scanner]
    RoleGrant:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        eventId:
          { type: string, format: uuid, description: "Périmètre événement (phase 2). Absent = organisation entière." }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        joinedAt: { type: string, format: date-time }
        grants:
          type: array
          items:
            type: object
            properties:
              role: { $ref: "#/components/schemas/Role" }
              roleName: { type: string }
              eventId: { type: [string, "null"] }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        roleName: { type: string }
        eventId: { type: [string, "null"] }
        eventTitle: { type: [string, "null"] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastSentAt: { type: string, format: date-time }
        invitedByName: { type: string }
    PublicInvitation:
      type: object
      properties:
        organizationName: { type: string }
        roleName: { type: string }
        eventTitle:
          { type: [string, "null"], description: "Titre de l'événement si l'invitation est limitée à un seul." }
        invitedByName: { type: string }
        emailHint: { type: string, example: "no••••@example.org" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
    EventStatus:
      type: string
      enum: [draft, published, suspended, completed, cancelled, archived]
    EventVisibility:
      type: string
      enum: [public, unlisted, private]
    EventLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addressLine1: { type: [string, "null"] }
        addressLine2: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        city: { type: string }
        country: { type: string, example: FR }
        accessNotes: { type: [string, "null"] }
    EventSettings:
      type: object
      properties:
        accessInfo: { type: [string, "null"] }
        programme: { type: [string, "null"] }
        contactEmail: { type: [string, "null"] }
        externalUrl: { type: [string, "null"] }
        showRemainingCapacity: { type: boolean }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        tagline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        doorsAt: { type: [string, "null"], format: date-time }
        timezone: { type: string, example: Europe/Paris }
        capacity: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/EventStatus" }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        location: { oneOf: [{ $ref: "#/components/schemas/EventLocation" }, { type: "null" }] }
        settings: { $ref: "#/components/schemas/EventSettings" }
    EventListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        capacity: { type: integer }
        locationName: { type: [string, "null"] }
        city: { type: [string, "null"] }
    EventWrite:
      type: object
      description: Corps de création (tous requis sauf mention) ; en PATCH tous optionnels + `version` requis.
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        slug: { type: string, description: "Optionnel : dérivé du titre (suffixe en cas de doublon)." }
        tagline: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 20000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "Strictement après startsAt, ≤ 31 jours." }
        doorsAt: { type: string, format: date-time, description: "≤ startsAt." }
        timezone: { type: string, default: Europe/Paris }
        capacity: { type: integer, minimum: 0, default: 0 }
        visibility: { $ref: "#/components/schemas/EventVisibility" }
        locationId: { type: string, format: uuid, description: "Lieu de la même organisation (404 sinon)." }
        settings: { $ref: "#/components/schemas/EventSettings" }
    PublicOrganization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        legalForm: { type: string }
        timezone: { type: string }
        contactEmail: { type: [string, "null"] }
        website: { type: [string, "null"] }
    PublicEventCard:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        tagline: { type: [string, "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        locationName: { type: [string, "null"] }
        city: { type: [string, "null"] }
    PublicEvent:
      description: Même forme que `Event` sans `organizationId` ni `version`, avec `organization`.
      allOf:
        - { $ref: "#/components/schemas/Event" }
        - type: object
          properties:
            organization: { $ref: "#/components/schemas/PublicOrganization" }
    TicketType:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer, minimum: 0, description: "0 = gratuit (ni frais ni paiement)" }
        currency: { type: string }
        quota: { type: [integer, "null"] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
        minPerOrder: { type: integer }
        maxPerOrder: { type: integer }
        hidden: { type: boolean }
        membersOnly:
          {
            type: boolean,
            description: "réservé aux adhérents actifs (vérifié à la réservation, aux coordonnées et au paiement)",
          }
        position: { type: integer }
        status: { type: string, enum: [active, archived] }
        poolId: { type: [string, "null"] }
        poolName: { type: [string, "null"] }
        sold: { type: integer }
        held: { type: integer }
        available: { type: [integer, "null"], description: "null = illimité" }
    TicketTypeWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        quota: { type: [integer, "null"] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
        minPerOrder: { type: integer, minimum: 1, maximum: 50 }
        maxPerOrder: { type: integer, minimum: 1, maximum: 50 }
        hidden: { type: boolean }
        position: { type: integer }
        poolId: { type: [string, "null"], format: uuid }
    TicketingSettings:
      type: object
      properties:
        ticketingStatus: { type: string, enum: [not_configured, open, closed] }
        maxTicketsPerOrder: { type: integer }
        salesCloseAt: { type: [string, "null"], format: date-time }
        nominativeTickets: { type: boolean }
        capacity: { type: integer }
        currency: { type: string }
    OrderStatus:
      type: string
      enum: [draft, reserved, awaiting_payment, paid, failed, expired, partially_refunded, refunded]
    TicketStatus:
      type: string
      enum: [pending, valid, used, revoked, refunded]
    OrderTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: KR-1048-01 }
        attendeeName: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TicketStatus" }
        typeLabel: { type: string }
        ticketTypeId: { type: string, format: uuid }
        priceMinor: { type: integer }
        feeMinor: { type: integer }
        usedAt: { type: [string, "null"], format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: KR-1048 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationSlug: { type: string }
        event:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            title: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string }
            locationName: { type: [string, "null"] }
            city: { type: [string, "null"] }
            nominativeTickets: { type: boolean }
        buyer:
          type: object
          properties:
            email: { type: string }
            firstName: { type: [string, "null"] }
            lastName: { type: [string, "null"] }
            userId: { type: [string, "null"] }
        currency: { type: string }
        subtotalMinor: { type: integer }
        discountMinor: { type: integer }
        feesMinor: { type: integer }
        totalMinor: { type: integer, description: "= subtotal − discount + fees" }
        promoCode: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              ticketTypeId: { type: string }
              label: { type: string }
              quantity: { type: integer }
              unitPriceMinor: { type: integer }
              unitFeeMinor: { type: integer }
        tickets: { type: array, items: { $ref: "#/components/schemas/OrderTicket" } }
        payment:
          type: [object, "null"]
          properties:
            id: { type: string }
            status: { type: string }
            provider: { type: string, enum: [stripe, fake] }
            methodLabel: { type: [string, "null"] }
            amountMinor: { type: integer }
            refundedMinor: { type: integer }
            failureReason: { type: [string, "null"] }
        refunds:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              amountMinor: { type: integer }
              reason: { type: string }
              status: { type: string, enum: [pending, succeeded, failed] }
              createdAt: { type: string, format: date-time }
              ticketIds: { type: array, items: { type: string } }
        history:
          type: array
          items: { type: object, properties: { at: { type: string, format: date-time }, label: { type: string } } }
    BuyerOrder:
      description: "`Order` + `accessToken` (renvoyé à la réservation et sur les lectures acheteur) + `ticketLinks` (id billet → jeton de page billet)."
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            accessToken: { type: string }
            ticketLinks: { type: object, additionalProperties: { type: string } }
    OrderListItem:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        eventId: { type: string }
        eventTitle: { type: string }
        buyerEmail: { type: string }
        buyerName: { type: string }
        ticketsSummary: { type: string, example: "2 × Standard" }
        ticketCount: { type: integer }
        totalMinor: { type: integer }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
    TicketingStats:
      type: object
      properties:
        paidTickets: { type: integer }
        grossRevenueMinor: { type: integer, description: "billets payés, remises déduites, hors frais" }
        refundedMinor: { type: integer }
        pendingOrders: { type: integer }
        admitted: { type: integer }
        currency: { type: string }
    PublicTicketType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor: { type: integer }
        unitFeeMinor: { type: integer, description: "frais acheteur par billet, annoncés avant paiement" }
        membersOnly: { type: boolean }
        currency: { type: string }
        minPerOrder: { type: integer }
        maxPerOrder: { type: integer }
        available: { type: [integer, "null"] }
        saleState: { type: string, enum: [upcoming, on_sale, ended, sold_out] }
        salesStartAt: { type: [string, "null"], format: date-time }
        salesEndAt: { type: [string, "null"], format: date-time }
    PublicTicketing:
      type: object
      properties:
        open: { type: boolean }
        closedReason: { type: [string, "null"] }
        maxTicketsPerOrder: { type: integer }
        nominativeTickets: { type: boolean }
        currency: { type: string }
        types: { type: array, items: { $ref: "#/components/schemas/PublicTicketType" } }
    TicketPage:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        attendeeName: { type: [string, "null"] }
        typeLabel: { type: string }
        priceMinor: { type: integer }
        currency: { type: string }
        qrCredential:
          {
            type: [string, "null"],
            description: "identifiant opaque à encoder en QR ; null sauf billet valide/utilisé",
          }
        usedAt: { type: [string, "null"], format: date-time }
        order:
          { type: object, properties: { id: { type: string }, number: { type: string }, buyerName: { type: string } } }
        event: { type: object }
        organization: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        siblings: { type: array, items: { type: object } }
    ScanOutcome:
      type: object
      properties:
        result: { type: string, enum: [accepted, already_used, revoked, refunded, invalid] }
        ticket:
          {
            type: [object, "null"],
            properties:
              { number: { type: string }, attendeeName: { type: [string, "null"] }, typeLabel: { type: string } },
          }
        firstScan:
          {
            type: [object, "null"],
            properties: { at: { type: string, format: date-time }, byName: { type: [string, "null"] } },
          }
        scannedAt: { type: string, format: date-time }
        counters: { type: object, properties: { admitted: { type: integer }, valid: { type: integer } } }
    PaymentAccount:
      type: object
      properties:
        provider: { type: string, enum: [stripe, fake] }
        providerAccountId: { type: string }
        status: { type: string, enum: [pending, active, restricted, disconnected] }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        lastSyncedAt: { type: [string, "null"], format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: member.roles_changed }
        actorKind: { type: string }
        actorId: { type: [string, "null"] }
        targetType: { type: string }
        targetId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
    MembershipPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        priceMinor:
          { type: integer, minimum: 0, description: "0 = adhésion gratuite (activation immédiate à l'approbation)" }
        currency: { type: string }
        periodKind: { type: string, enum: [fixed, rolling] }
        validFrom: { type: [string, "null"], format: date-time, description: période fixe }
        validUntil: { type: [string, "null"], format: date-time, description: période fixe }
        durationMonths: { type: [integer, "null"], description: période glissante }
        requiresReview: { type: boolean }
        maxMembers: { type: [integer, "null"] }
        public: { type: boolean }
        position: { type: integer }
        status: { type: string, enum: [active, archived] }
        benefits: { type: array, items: { type: string } }
        taken: { type: integer, description: "actives + en cours (compte dans le quota)" }
        activeMembers: { type: integer }
    MembershipPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        periodKind: { type: string, enum: [fixed, rolling] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        durationMonths: { type: integer, minimum: 1, maximum: 60 }
        requiresReview: { type: boolean }
        maxMembers: { type: [integer, "null"] }
        public: { type: boolean }
        position: { type: integer }
        benefits: { type: array, items: { type: string }, maxItems: 12 }
    Membership:
      type: object
      description: Vue organisateur d'une adhésion (jamais de jeton ni de hash).
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationSlug: { type: string }
        number: { type: string, example: M-0001 }
        status: { type: string, enum: [pending, awaiting_payment, active, rejected, suspended, expired, cancelled] }
        plan:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            periodKind: { type: string, enum: [fixed, rolling] }
            requiresReview: { type: boolean }
        member:
          type: object
          properties:
            email: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            userId: { type: [string, "null"] }
        priceMinor: { type: integer }
        feesMinor: { type: integer, description: frais de service annoncés avant paiement }
        currency: { type: string }
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        renewedFrom: { type: [string, "null"], format: uuid }
        renewedBy: { type: [string, "null"], format: uuid }
        activatedAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"] }
        application:
          type: [object, "null"]
          properties:
            id: { type: string }
            status: { type: string, enum: [submitted, approved, rejected, withdrawn] }
            rejectionReason: { type: [string, "null"] }
            reviewedAt: { type: [string, "null"], format: date-time }
        payment:
          type: [object, "null"]
          properties:
            id: { type: string }
            status: { type: string }
            methodLabel: { type: [string, "null"] }
            amountMinor: { type: integer }
        validityChanges:
          type: array
          description: Historique append-only des changements de validité.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind: { type: string, enum: [activated, extended, suspended, reactivated, expired, cancelled, renewed] }
              newValidFrom: { type: [string, "null"], format: date-time }
              newValidUntil: { type: [string, "null"], format: date-time }
              reason: { type: [string, "null"] }
              actor: { type: string }
        marketingOptIn: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    MemberMembership:
      allOf:
        - { $ref: "#/components/schemas/Membership" }
        - type: object
          properties:
            accessToken: { type: string, description: "Jeton d'accès adhérent (dérivé, jamais stocké)." }
            renewalPlans:
              type: array
              description: Formules proposées au renouvellement (fenêtre J-60 → +365 j, places restantes).
              items: { $ref: "#/components/schemas/MembershipPlan" }
    MembershipListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        memberName: { type: string }
        memberEmail: { type: string }
        planName: { type: string }
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        memberSince: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    MembershipStats:
      type: object
      properties:
        active: { type: integer }
        toRenew: { type: integer, description: actives expirant sous 30 jours }
        pending: { type: integer }
        duesMinor: { type: integer, description: cotisations des adhésions actives, hors frais }
        currency: { type: string }
    MembershipApplicationInput:
      type: object
      required: [planId, email, firstName, lastName]
      properties:
        planId: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        marketingOptIn: { type: boolean }
  responses:
    Unauthenticated:
      {
        description: Connexion requise,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Forbidden:
      {
        description: Permission refusée ou origine non autorisée,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    NotFound:
      {
        description: Introuvable (ou non membre — l'existence n'est pas divulguée),
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Validation:
      {
        description: Valeurs invalides,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    StaleVersion:
      {
        description: "409 stale_version — l'événement a été modifié entre-temps ; rechargez.",
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    EventData:
      {
        description: OK,
        content:
          {
            application/json:
              { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Event" } } } },
          },
      }
security:
  - session: []
paths:
  /profiles/me:
    get:
      summary: Profil de l'utilisateur connecté
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Profile" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      summary: Modifier son profil
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                timezone: { type: string }
                phone: { type: string, maxLength: 30 }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations:
    get:
      summary: Organisations dont je suis membre actif
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  {
                                    allOf:
                                      [
                                        { $ref: "#/components/schemas/Organization" },
                                        {
                                          type: object,
                                          properties:
                                            { roles: { type: array, items: { $ref: "#/components/schemas/Role" } } },
                                        },
                                      ],
                                  },
                              },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Créer une organisation (l'appelant devient propriétaire)
      description: Audit `organization.created`. Transaction unique (organisation, réglages, membre, rôle, audit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?$" }
                legalForm:
                  { type: string, enum: [association, company, collective, public_body, other], default: association }
                country: { type: string, default: FR }
                timezone: { type: string, default: Europe/Paris }
      responses:
        "201":
          {
            description: Créée (en-tête Location),
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Organization" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Slug déjà utilisé }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lire une organisation
      description: Permission `organization.read`. Les non-membres reçoivent 404.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Organization" } } } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    patch:
      summary: Modifier une organisation et ses réglages
      description: Permission `organization.manage`. Audit `organization.updated`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                legalForm: { type: string }
                country: { type: string }
                timezone: { type: string }
                settings:
                  type: object
                  properties:
                    contactEmail: { type: string }
                    website: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/members:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Membres actifs et leurs rôles
      description: Permission `organization.read`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Member" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Retirer un membre
      description: |
        Permission `members.manage` ; retirer un propriétaire exige d'être propriétaire ; le dernier propriétaire
        ne peut pas être retiré (412 `last_owner`). Verrou sur la ligne organisation. Audit `member.removed`.
      parameters:
        - { name: reason, in: query, schema: { type: string } }
      responses:
        "204": { description: Retiré }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Dernier propriétaire }
  /organizations/{organizationId}/members/{memberId}/roles:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Remplacer les rôles d'un membre
      description: |
        Permission `members.manage` ; accorder ou retirer `owner` exige d'être propriétaire ; protection du
        dernier propriétaire (412). Remplacement atomique. Audit `member.roles_changed` (avant/après, motif).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RoleGrant" } }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Member" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Dernier propriétaire }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/invitations:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Invitations (toutes, 200 dernières)
      description: Permission `members.invite`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/Invitation" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Inviter une adresse avec un rôle
      description: |
        Permission `members.invite` (rôle `owner` : propriétaire uniquement). 409 si déjà membre ou invitation en
        attente. Jeton 256 bits envoyé par e-mail, seul son SHA-256 est stocké ; expiration 7 jours. Audit `invitation.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                eventId: { type: string, format: uuid }
      responses:
        "201":
          {
            description: Créée,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Invitation" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Déjà membre ou invitation en attente }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Annuler une invitation en attente
      description: Permission `members.invite`. Audit `invitation.revoked`.
      responses:
        "204": { description: Annulée }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/invitations/{invitationId}/resend:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Renvoyer une invitation (nouveau jeton, nouvelle expiration)
      description: Permission `members.invite`. 412 si acceptée ou annulée. Audit `invitation.resent`.
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { description: Invitation close }
  /organizations/{organizationId}/audit:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Journal d'audit (50 dernières entrées)
      description: Permission `organization.manage`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /invitations/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: Métadonnées publiques d'une invitation
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PublicInvitation" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      summary: Accepter une invitation avec le compte connecté
      description: |
        E-mail du compte vérifié et identique à l'adresse invitée (403 sinon). 412 si expirée, déjà utilisée ou
        e-mail non vérifié. Usage unique (verrou `FOR UPDATE`). Audit `invitation.accepted`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                properties: { organizationId: { type: string }, organizationSlug: { type: string } },
                              },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Expirée, close ou e-mail non vérifié }

  # ----------------------------------------------------------------------------------------------
  # Phase 2 — événements, lieux, lecture publique
  # ----------------------------------------------------------------------------------------------
  /organizations/{organizationId}/events:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lister les événements (toute l'organisation, ou seulement ceux attribués)
      description: |
        `events.read`. Un membre dont les droits sont limités à certains événements ne voit que ceux-là.
        `status=active` (défaut : brouillons + publiés + suspendus) · `all` · ou un statut précis.
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, all, draft, published, suspended, completed, cancelled, archived] },
          }
        - { name: q, in: query, schema: { type: string }, description: Recherche sur le titre }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/EventListItem" } } },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer un événement (brouillon)
      description: "`events.create`. Slug dérivé du titre si absent. Audit `event.created`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventWrite" } } }
      responses:
        "201": { $ref: "#/components/responses/EventData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Lieu inconnu dans cette organisation }
        "409": { description: Slug déjà utilisé (si fourni explicitement) }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/events/{eventId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'un événement
      description: "`events.read` au périmètre de l'événement ; 404 hors périmètre (existence non divulguée)."
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Modifier un événement
      description: |
        `events.update`. Corps : champs de `EventWrite` (tous optionnels) + `version` (requis).
        Un événement publié dont les dates ou le lieu changent émet `event.logistics_changed` (outbox).
        Un événement archivé n'est plus modifiable (412). Audit `event.updated` avec le diff des champs.
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Événement archivé ou lieu archivé }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      summary: Supprimer un brouillon
      description: "`events.update`. Brouillons uniquement (412 sinon) ; un événement publié s'annule puis s'archive. Audit `event.deleted`."
      responses:
        "204": { description: Supprimé }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Pas un brouillon }
  /organizations/{organizationId}/events/{eventId}/publish:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Publier
      description: |
        `events.publish`. Corps `{ version }`. Transition `draft → published` gardée par la check-list
        (titre, description ≥ 20 caractères, dates cohérentes et futures, lieu, capacité > 0) et par le
        statut actif de l'organisation (verrou `FOR UPDATE`). 412 `publication_blocked` avec
        `details.checklist` ; outbox `event.published` ; audit `event.published`.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { type: object, required: [version], properties: { version: { type: integer } } } },
          }
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Check-list incomplète ou transition impossible }
  /organizations/{organizationId}/events/{eventId}/cancel:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Annuler un événement publié
      description: "`events.cancel`. Corps `{ version, reason }` (motif ≥ 5 caractères, conservé et affiché publiquement). Outbox `event.cancelled`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties: { version: { type: integer }, reason: { type: string, minLength: 5, maxLength: 1000 } }
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Transition impossible depuis ce statut }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/events/{eventId}/archive:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Archiver (terminal)
      description: "`events.update`. Depuis brouillon, terminé ou annulé. Corps `{ version }`."
      responses:
        "200": { $ref: "#/components/responses/EventData" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaleVersion" }
        "412": { description: Transition impossible depuis ce statut }
  /organizations/{organizationId}/locations:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lieux actifs de l'organisation
      description: "`events.read`."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/EventLocation" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer un lieu
      description: "`events.update`. Audit `location.created`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city]
              properties:
                name: { type: string, maxLength: 120 }
                addressLine1: { type: string }
                addressLine2: { type: string }
                postalCode: { type: string }
                city: { type: string }
                country: { type: string, default: FR }
                accessNotes: { type: string }
      responses:
        "201":
          {
            description: Créé,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/EventLocation" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /organizations/{organizationId}/locations/{locationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifier un lieu
      description: "`events.update`."
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      summary: Archiver un lieu
      description: "`events.update`. Les événements qui le référencent le conservent ; il n'est plus proposé."
      responses:
        "204": { description: Archivé }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/organizations/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: Carte publique d'une organisation et ses événements publiés
      description: "Anonyme. `Cache-Control: public, max-age=60`. Événements publiés et publics, terminés depuis moins de 30 jours inclus."
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                properties:
                                  {
                                    organization: { $ref: "#/components/schemas/PublicOrganization" },
                                    events: { type: array, items: { $ref: "#/components/schemas/PublicEventCard" } },
                                  },
                              },
                          },
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/organizations/{slug}/events/{eventSlug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: eventSlug, in: path, required: true, schema: { type: string } }
    get:
      summary: Page publique d'un événement
      description: |
        Anonyme. Servi si publié, terminé ou annulé ET public ou « lien direct » (unlisted). Brouillons,
        suspendus, archivés et privés : 404. Jamais `organizationId` ni `version`.
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
