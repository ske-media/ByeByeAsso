          name: k,
          in: query,
          schema: { type: string },
          description: Jeton d'accès adhérent (ou Authorization Bearer,
          ou compte propriétaire),
        }
    get:
      summary: Carte d'adhérent (vue adhérent)
      security: []
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberMembership" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/memberships/{membershipId}/checkout:
    parameters:
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: k, in: query, required: true, schema: { type: string } }
    post:
      summary: Régler la cotisation (page hébergée)
      description: "`awaiting_payment` uniquement (412 `not_awaiting_payment`). L'activation vient du webhook."
      security: []
      responses:
        "200": { description: "`{ kind: redirect, url, paymentId }` ou `{ kind: active }`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Pas de paiement attendu / compte de paiement indisponible }
  /public/memberships/{membershipId}/renew:
    parameters:
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: k, in: query, required: true, schema: { type: string } }
    post:
      summary: Renouveler (nouvelle adhésion liée)
      description: |
        Corps `{ planId }` parmi `renewalPlans`. Mêmes règles de revue et de paiement ; la nouvelle période
        démarre à la fin de l'actuelle (formule glissante). 412 `already_renewed`.
      security: []
      responses:
        "201": { description: Nouvelle adhésion (avec son accessToken) }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Déjà renouvelée }
  /payments/webhooks/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [stripe, fake] } }
    post:
      summary: Webhook du prestataire de paiement
      description: |
        Serveur → serveur : pas de session ni de vérification d'origine ; la signature sur le corps BRUT
        (`Stripe-Signature` / `X-Kroov-Signature`) authentifie l'appel. Idempotent par (provider, event id) ;
        hors séquence et paiements tardifs résolus sous verrou de la commande. 200 `{ received, outcome }`,
        400 signature invalide, 404 prestataire non configuré, 500 → le prestataire réessaie.
      security: []
      responses:
        "200": { description: Reçu }
        "400": { description: Signature invalide }
        "404": { description: Prestataire inconnu }
  /payments/fake/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: "Fournisseur simulé (développement / test) : données de la session"
      security: []
      responses: { "200": { description: OK }, "404": { description: Hors environnement de test } }
    post:
      summary: "Fournisseur simulé : régler la session { decision: succeeded | failed } et livrer le webhook signé"
      security: []
      responses:
        {
          "200": { description: "{ status, webhookStatus, outcome, redirectUrl }" },
          "404": { description: Hors environnement de test },
        }
