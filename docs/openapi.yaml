  /organizations/{organizationId}/orders:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Commandes de l'organisation (+ indicateurs)
      description: "`orders.read` (périmètre événement respecté). Les réservations abandonnées sans coordonnées sont omises."
      parameters:
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
