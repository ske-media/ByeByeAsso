    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
      - {
          name: action,
          in: path,
          required: true,
          schema: { type: string, enum: [approve, reject, suspend, reactivate, cancel, extend, resend] },
        }
    post:
      summary: Décision sur une adhésion
      description: |
        `approve` : pending → active (gratuite) ou awaiting_payment (payante, lien de paiement envoyé).
        `reject` / `suspend` / `cancel` : corps `{ reason }` (3–500 caractères), transmis à la personne.
        `reactivate` : suspended → active. `extend` : `{ validUntil, reason }`, tracé dans l'historique.
        `resend` : nouveau lien (l'ancien est révoqué par incrément de `secret_version`), 204.
        Toute transition illégale → 412 `invalid_transition`. Audit dans la même transaction.
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: OK }
        "204": { description: Lien renvoyé }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: Transition impossible }
        "422": { $ref: "#/components/responses/Validation" }
