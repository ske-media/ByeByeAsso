                        type: object,
                        properties: { data: { type: array, items: { $ref: "#/components/schemas/MembershipPlan" } } },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Créer une formule
