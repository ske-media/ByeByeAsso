                    schema: { type: object, properties: { data: { $ref: "#/components/schemas/TicketingSettings" } } },
                  },
              },
          }
    patch:
      summary: Ouvrir / fermer les ventes, maximum par commande, clôture, billets nominatifs
      description: "`tickets.manage`. Ouverture refusée (412) sans tarif actif ou si l'événement n'est pas publié."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketingStatus: { type: string, enum: [open, closed] }
                maxTicketsPerOrder: { type: integer, minimum: 1, maximum: 50 }
                salesCloseAt: { type: [string, "null"], format: date-time }
                nominativeTickets: { type: boolean }
      responses:
        "200": { description: OK }
        "412": { description: Préconditions d'ouverture non remplies }
