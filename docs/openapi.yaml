          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    rank: { type: integer },
                    positionId: { type: string },
                    positionName: { type: string },
                    active: { type: boolean },
                    eligible: { type: boolean },
                  },
              },
          }
        availabilities: { type: array, items: { $ref: "#/components/schemas/AvailabilityRange" } }
