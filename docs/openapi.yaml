        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders: { type: array, items: { $ref: "#/components/schemas/OrderListItem" } }
                      stats: { $ref: "#/components/schemas/TicketingStats" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/{organizationId}/orders/{orderId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une commande (organisateur)
      description: "`orders.read` au périmètre de l'événement de la commande ; 404 sinon. Jamais de liens acheteur."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/{organizationId}/orders/{orderId}/refunds:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Rembourser (total ou par billets)
      description: |
        `orders.refund`. Corps `{ full: true } | { ticketIds: [...] }` + `reason` (3–500 caractères).
        Montant = prix − part de remise + frais de chaque billet ; jamais plus que encaissé − déjà remboursé
        (verrou sur le paiement). Billets → `refunded` (places libérées), ledger, audit, e-mail à l'acheteur.
        Commande gratuite : remboursement direct ; sinon via le prestataire (reverse transfer + commission).
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Order" } } } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412":
          { description: "order_not_refundable · already_refunded · refund_exceeds_payment · provider_refund_failed" }
  /organizations/{organizationId}/orders/{orderId}/resend:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Renvoyer les billets
      description: "`orders.read`. Les jetons des liens sont renouvelés : les anciens liens cessent de fonctionner."
      responses: { "204": { description: Envoyé }, "412": { description: Commande non payée } }
  /organizations/{organizationId}/events/{eventId}/checkins:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
