name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgres://kroov:kroov@localhost:5432/kroov
  DATABASE_URL_TEST: postgres://kroov:kroov@localhost:5432/kroov_test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-only-secret-value-that-is-at-least-32-characters-long

jobs:
  validate:
    name: Lint · typecheck · unit · integration · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kroov
          POSTGRES_PASSWORD: kroov
          POSTGRES_DB: kroov
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kroov -d kroov"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE kroov_test OWNER kroov;"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm build

  e2e:
    name: End-to-end + sécurité (serveur réel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kroov
          POSTGRES_PASSWORD: kroov
          POSTGRES_DB: kroov
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kroov -d kroov"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @kroov/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start web (test policy, file mailbox)
        run: |
          (cd apps/web && APP_ENV=test EMAIL_PROVIDER=file EMAIL_FILE_PATH=$GITHUB_WORKSPACE/.tmp/outbox.jsonl pnpm exec next start --port 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/v1/health && break; sleep 2; done
      - name: Security tests (direct API, forged ids)
        run: E2E_BASE_URL=http://localhost:3000 EMAIL_FILE_PATH=$GITHUB_WORKSPACE/.tmp/outbox.jsonl pnpm test:security
      - name: End-to-end (Playwright)
        run: E2E_BASE_URL=http://localhost:3000 EMAIL_FILE_PATH=$GITHUB_WORKSPACE/.tmp/outbox.jsonl pnpm test:e2e
      - name: Server log
        if: failure()
        run: tail -200 web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
